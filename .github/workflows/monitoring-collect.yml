name: Collect monitoring candidates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1-5'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/collect-monitoring.cjs
      - name: Commit collected monitoring candidates
        run: |
          if git diff --quiet -- data/monitoring/latest.json; then
            echo "No monitoring changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitoring/latest.json
          git commit -m "Update monitoring candidates"
          git push
